services:

  # ── Spring Boot Backend (Docker) ─────────────────────────────────────────────
  # Render supports Docker on all plans including free
  - type: web
    name: linkshort-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "8080"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: "900000"
      - key: JWT_REFRESH_EXPIRY
        value: "604800000"
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ── React Frontend (Static Site) ──────────────────────────────────────────────
  - type: web
    name: linkshort-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_BASE_URL
        sync: false
      - key: VITE_SHORT_DOMAIN
        sync: false
