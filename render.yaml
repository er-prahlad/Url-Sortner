services:

  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  - type: web
    name: linkshort-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/linkshort-backend-1.0.0.jar
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false          # Set manually in Render dashboard
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false          # Generate: openssl rand -base64 32
      - key: JWT_ACCESS_EXPIRY
        value: "900000"
      - key: JWT_REFRESH_EXPIRY
        value: "604800000"
      - key: APP_BASE_URL
        sync: false          # e.g. https://linkshort-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # e.g. https://linkshort-frontend.onrender.com

  # ── React Frontend ────────────────────────────────────────────────────────────
  - type: web
    name: linkshort-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # e.g. https://linkshort-backend.onrender.com/api/v1
      - key: VITE_APP_BASE_URL
        sync: false          # e.g. https://linkshort-frontend.onrender.com
      - key: VITE_SHORT_DOMAIN
        sync: false          # e.g. linkshort-backend.onrender.com
