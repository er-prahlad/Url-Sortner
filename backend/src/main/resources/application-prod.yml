# ── Production profile ────────────────────────────────────────────────────────
# Activated on Render via SPRING_PROFILES_ACTIVE=prod

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0          # Do NOT pre-create connections at startup
      initialization-fail-timeout: -1   # Don't fail startup if pool init is slow
      connection-timeout: 60000         # 60 s — Aiven SSL handshake can be slow
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    connect-retries: 5               # Retry DB connection up to 5 times
    connect-retries-interval: 5      # 5 seconds between retries

server:
  port: ${PORT:10000}

app:
  base-url: ${APP_BASE_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.linkshort: INFO
    com.zaxxer.hikari: INFO
    org.flywaydb: INFO
