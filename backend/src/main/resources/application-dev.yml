# ── Development profile ───────────────────────────────────────────────────────
# Activate with: --spring.profiles.active=dev  or  SPRING_PROFILES_ACTIVE=dev

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true

app:
  base-url: http://localhost:8080
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  jwt:
    # DEVELOPMENT ONLY key — NEVER use in production
    # Generate a real one: openssl rand -base64 32
    secret: ZGV2LW9ubHktc2VjcmV0LWtleS1mb3ItbG9jYWwtdGVzdGluZy1vbmx5AAAA
    access-token-expiry: 900000
    refresh-token-expiry: 604800000
  rate-limit:
    auth-max-requests: 100
    link-max-requests: 1000
    window-seconds: 60

logging:
  level:
    com.linkshort: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
