spring:
  application:
    name: linkshort-backend

  datasource:
    # Supabase uses a connection pooler (port 6543) for deployed apps.
    # Fall back to direct connection (port 5432) for local dev.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5        # Supabase free tier: max 20 direct, keep low
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      # Supabase pooler (transaction mode) does not support prepared statements
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    url: ${DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ── Application properties ─────────────────────────────────────────────────────
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: ${JWT_ACCESS_EXPIRY:900000}
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000}

  rate-limit:
    auth-max-requests: ${RATE_LIMIT_AUTH:10}
    link-max-requests: ${RATE_LIMIT_LINKS:60}
    window-seconds: ${RATE_LIMIT_WINDOW:60}

  link-expiry-check-ms: ${LINK_EXPIRY_CHECK_MS:300000}

logging:
  level:
    root: INFO
    com.linkshort: INFO
    org.springframework.security: WARN
