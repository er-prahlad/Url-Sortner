spring:
  application:
    name: linkshort-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/linkshort?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:linkshort}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ── Application properties ────────────────────────────────────────────────────
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  cors:
    # Add your Vercel frontend URL here, e.g. https://linkshort.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET}         # Required: base64-encoded 256-bit key
    access-token-expiry: ${JWT_ACCESS_EXPIRY:900000}      # 15 min
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000} # 7 days

  rate-limit:
    auth-max-requests: ${RATE_LIMIT_AUTH:10}
    link-max-requests: ${RATE_LIMIT_LINKS:60}
    window-seconds: ${RATE_LIMIT_WINDOW:60}

  link-expiry-check-ms: ${LINK_EXPIRY_CHECK_MS:300000}   # 5 min

logging:
  level:
    root: INFO
    com.linkshort: INFO
    org.springframework.security: WARN
